name: Test

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    timeout-minutes: 25
    runs-on: ubuntu-latest
    # The app ships as an Arch package built against Arch's Qt, so it's tested there.
    container: archlinux:latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Install git for the checkout
        run: pacman -Syu --noconfirm --needed git

      - uses: actions/checkout@v4

      - name: Install the package's dependencies
        # The package lives in omarchy-pkgs, so its PKGBUILD is the one list of what the app needs and CI reads it rather than keeping a copy.
        run: |
          curl -fsSL "https://raw.githubusercontent.com/omacom/omarchy-pkgs/master/pkgbuilds/omawrite/PKGBUILD" -o "$RUNNER_TEMP/PKGBUILD"
          source "$RUNNER_TEMP/PKGBUILD"
          deps=("${depends[@]}" "${makedepends[@]}" "${checkdepends[@]}")
          pacman -S --noconfirm --needed base-devel cmake ninja perl hunspell dbus "${deps[@]%%[<>=]*}"

      - name: Set up a user and a locale like a desktop's
        # Root can read any file, so tests about unreadable ones need an ordinary user, with a second group for tests that change a file's group; and the container generates no locale.
        run: |
          useradd -m tester
          groupadd other
          usermod -aG other tester
          chown -R tester .
          sed -i 's/^#en_US.UTF-8/en_US.UTF-8/' /etc/locale.gen
          locale-gen

      - name: Build
        run: su tester -c bin/build

      - name: Test
        run: su tester -c 'LANG=en_US.UTF-8 dbus-run-session -- bin/test'

      - name: Preserve failed test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-test-logs
          path: build/cmake/Testing/Temporary/
          if-no-files-found: ignore

  windows-packaging:
    name: Windows packaging checks
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Windows PowerShell 5.1, not pwsh. Compile the actual installer script
      # for both compiler kits using real Inno and a fake GUI app payload.
      # No installer execution; not a substitute for installation tests.
      - name: Check PowerShell scripts, upgrade guards and packaging
        shell: powershell
        run: .\tests\windows-packaging.ps1

  windows-editor:
    name: Windows Qt ${{ matrix.qt }} editor regressions
    runs-on: windows-2022
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - qt: '6.8.3'
            scale: '1'
          - qt: '6.12.0'
            scale: '1.5'
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 2
      QT_QUICK_BACKEND: software
      QT_SCALE_FACTOR: ${{ matrix.scale }}
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt }}
          arch: win64_msvc2022_64
          cache: true

      - name: Build native editor tests with the pinned dependencies
        shell: pwsh
        run: |
          cmake -S dependencies -B .deps/windows-ci -G Ninja "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR" -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build .deps/windows-ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake -S . -B build/windows-ci -G Ninja "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR" "-DWRITE_DEPENDENCY_PREFIX=$PWD/.deps/windows-ci/install" -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build/windows-ci --target omawrite_editor_tests
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      # Native Windows platform and real clipboard/shortcuts, not offscreen.
      # Include the preceding clipboard fixtures to expose cross-test state.
      - name: Test Windows clipboard, mode shortcuts and theme paths
        shell: pwsh
        run: |
          $global:LASTEXITCODE = 1
          & build/windows-ci/omawrite_editor_tests.exe `
            tableRectangleDragTypingImeClearAndUndo `
            codePanelHoverCopyAndReadLanguageUseQtClipboard `
            codePanelsHaveNativePaddingInBothModesAtDifferentZooms `
            quotePreviewPhysicalClickImeAndReadBreaks `
            horizontalRulesRevealMarkdownOnPhysicalClick `
            codeBlockPanelsAreContinuousDecorationsInBothThemes `
            modeShortcutWorksThroughTheFocusedEditorInBothModes `
            resumesEditingAtTheReadingViewport `
            pastesScreenshotThroughVisibleEditorAndPreservesSourceInReadMode `
            themePathsSupportUnicodeWithoutChangingHome `
            takesTheCodePanelFromTheTheme `
            reportsThemeChangesOnlyWhenTheyHappen `
            loadsCurrentOmarchyTheme `
            fallsBackForSelectionColors `
            keepsDefaultsForColorsItCannotParse `
            takesItsDefaultsFromTheModeTheThemeAsksFor `
            underlineShortcutUsesHtmlAndCanonicalUndo `
            inlineCodeMarkersFollowCaret `
            inlineMarkersFollowSelectionOffsetsWithinTheSameBlock `
            underlinePreviewIsCaretAwareAndLiteralInCode `
            codeShortcutsWrapSafelyAndUseCanonicalUndo `
            -o build/windows-ci/editor-tests.txt,txt | Out-Host
          $testExit = $LASTEXITCODE
          if (Test-Path build/windows-ci/editor-tests.txt) { Get-Content build/windows-ci/editor-tests.txt }
          exit $testExit

      - name: Run the complete native Windows editor suite
        shell: pwsh
        run: |
          $global:LASTEXITCODE = 1
          & build/windows-ci/omawrite_editor_tests.exe -o build/windows-ci/editor-native-all-tests.txt,txt | Out-Host
          $testExit = $LASTEXITCODE
          if (Test-Path build/windows-ci/editor-native-all-tests.txt) { Get-Content build/windows-ci/editor-native-all-tests.txt }
          exit $testExit

      - name: Run the complete portable editor suite on Windows
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          # Offscreen uses the generic font database, not Windows' native one.
          QT_QPA_FONTDIR: ${{ github.workspace }}/build/windows-ci/fonts
        run: |
          $fonts = New-Item -ItemType Directory -Force $env:QT_QPA_FONTDIR
          Get-ChildItem C:/Windows/Fonts -File | Where-Object { $_.Extension -in '.ttf', '.ttc', '.otf' } | Copy-Item -Destination $fonts.FullName
          # Server images lack a CJK fallback. Keep the wide-character hit test
          # intact using Noto CJK (SIL OFL), pinned to the Sans 2.004 release.
          $cjk = Join-Path $fonts.FullName NotoSansCJKsc-Regular.otf
          Invoke-WebRequest 'https://raw.githubusercontent.com/notofonts/noto-cjk/523d033d6cb47f4a80c58a35753646f5c3608a78/Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Regular.otf' -OutFile $cjk
          if ((Get-FileHash $cjk -Algorithm SHA256).Hash -ne '2c76254f6fc379fddfce0a7e84fb5385bb135d3e399294f6eeb6680d0365b74b') { throw 'Unexpected Noto CJK font checksum' }
          $global:LASTEXITCODE = 1
          & build/windows-ci/omawrite_editor_tests.exe -o build/windows-ci/editor-all-tests.txt,txt | Out-Host
          $testExit = $LASTEXITCODE
          if (Test-Path build/windows-ci/editor-all-tests.txt) { Get-Content build/windows-ci/editor-all-tests.txt }
          exit $testExit

      - name: Preserve Windows editor diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-editor-logs-qt-${{ matrix.qt }}
          path: |
            build/windows-ci/editor-tests.txt
            build/windows-ci/editor-all-tests.txt
            build/windows-ci/editor-native-all-tests.txt
            build/windows-ci/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore
